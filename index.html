<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a10"><meta name="description" content="AURA V4 — advanced local-first music player for phone and PC.">
<link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><title>AURA V4</title>
</head><body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">A</div><div><strong>AURA</strong><span>V4</span></div></div>
<button class="nav active" data-view="home">⌂ <span>Home</span></button><button class="nav" data-view="library">♫ <span>Library</span></button><button class="nav" data-view="smart">✦ <span>Smart Mix</span></button><button class="nav" data-view="playlists">☷ <span>Playlists</span></button><button class="nav" data-view="favorites">♥ <span>Favorites</span></button><button class="nav" data-view="lyrics">≋ <span>Lyrics</span></button>
<div class="grow"></div><button class="nav" data-action="import">＋ <span>Add music</span></button><button class="nav" data-action="settings">⚙ <span>Audio Lab</span></button><div class="status"><i></i><span id="status">Local + offline ready</span></div></aside>
<main class="main"><header><button class="hamb" data-action="menu">☰</button><div class="search"><span>⌕</span><input id="search" placeholder="Search songs, artists, albums…"><kbd>Ctrl K</kbd></div><div class="head-actions"><button data-action="theme">◐</button><button data-action="install" id="install" hidden>⇩</button></div></header>
<section id="content"></section></main>
<aside class="now"><div class="art" id="art"><span>A</span></div><div class="tag">NOW PLAYING</div><h2 id="nowTitle">Nothing playing</h2><p id="nowArtist">Choose a track</p><canvas id="vizMini"></canvas><div class="now-buttons"><button data-action="favorite" id="fav">♡</button><button data-action="lyrics">≋ Lyrics</button></div><div class="quick"><button data-action="sleep">⏱ Sleep</button><button data-action="queue">☰ Queue</button></div></aside>
<footer class="player"><div class="track-mini"><div class="thumb" id="thumb">A</div><div><strong id="ptitle">Nothing playing</strong><span id="partist">AURA V4</span></div></div><div class="controls"><button data-action="shuffle" id="shuffle">⤨</button><button data-action="prev">◀◀</button><button class="play" data-action="play" id="play">▶</button><button data-action="next">▶▶</button><button data-action="repeat" id="repeat">↻</button></div><div class="timeline"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="100" value="0" step="0.1"><span id="dur">0:00</span></div><div class="vol">🔊 <input id="volume" type="range" min="0" max="1" value=".85" step=".01"></div><button class="queue" data-action="queue">☰</button></footer></div>
<input id="files" type="file" accept="audio/*" multiple hidden><audio id="audio" preload="metadata"></audio><canvas id="visualizer"></canvas><dialog id="modal"><div id="modalBody"></div></dialog><div id="toast"></div>
<script src="app.js" defer></script></body></html>
